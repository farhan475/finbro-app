name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # The release build refuses to run without android/key.properties, so CI
      # signs with a throwaway key. Real release signing stays local.
      - name: Throwaway signing key
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/ci.jks" -alias ci -keyalg RSA -keysize 2048 \
            -validity 1 -storepass cipass -keypass cipass -dname "CN=FinBro CI"
          printf 'storeFile=%s\nstorePassword=cipass\nkeyAlias=ci\nkeyPassword=cipass\n' \
            "$RUNNER_TEMP/ci.jks" > android/key.properties
      - run: flutter build appbundle --release
